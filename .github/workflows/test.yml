name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No install step: Node 24 runs the TypeScript sources directly and this
      # package has no dependencies. `npm ci` would fail -- there is no lockfile
      # to install from, and nothing to put in one.
      - run: npm test
